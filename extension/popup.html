<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Picker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>Component Picker</h1>
        <button id="captureButton" class="button button--primary" type="button">Start capture</button>
      </header>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

      <section id="emptyState" class="empty-state" hidden>
        <p>No captures yet. Start capture on a page to save your first component.</p>
      </section>

      <section id="list" class="list" aria-label="Saved components"></section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
